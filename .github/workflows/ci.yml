name: CI

on:
  push:
    branches:[main]
  pull-request

jobs:
  
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    if: contains(github.event.head_commit.message, '') || contains(join(github.event.commits.*.modified, ','), 'email-agent-backend')

    defaults:
      run:
        working-directory: email-agent-backend

    steps:
      - uses: action/checkout@v4
      
      - name: Setup Go
        uses: action/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Build
        run: go build ./...
  
  frontend: 
    name: Frontend CI
    runs-on: ubuntu-latest

    if: contains(join(github.event.commits.*.modified, ','), 'email-agent-frontend')

    defaults:
      run:
        working-directory: email-agent-frontend

    steps:
      - uses: action/checkout@v4

      - name: Setup Node
        uses: aciton/setup-node@v4
        with:
          node-version: 25
          cache: "npm"
          cache-dependency-path: email-agent-frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint --if-present

      - name: build
        run: npm run build
